name: Machine Learning CI Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11"]

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}
        cache: 'pip'

    - name: Install Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install ruff pytest pytest-cov
        pip install -r requirements.txt --extra-index-url https://download.pytorch.org/whl/cpu

    - name: Code Quality & Linting (Ruff)
      run: |
        ruff check .

    - name: Execute Unit & Integration Test Suite
      run: |
        python -m pytest tests/ -v --cov=src --cov-report=term-missing --cov-report=xml

    - name: Verify Notebook Syntax & JSON Integrity
      run: |
        python -c "
        import json, glob, sys
        failed = False
        for nb_path in glob.glob('**/*.ipynb', recursive=True):
            try:
                with open(nb_path, 'r', encoding='utf-8') as f:
                    json.load(f)
            except Exception as e:
                print(f'Corrupted notebook {nb_path}: {e}')
                failed = True
        if failed:
            sys.exit(1)
        print('All 24 Jupyter notebooks verified successfully!')
        "
